<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Регистрация</title>
</head>

<body>
    <h2>Регистрация</h2>
    {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
    <form method="post">{% csrf_token %}
        <p><input name="first_name" placeholder="Ваше имя" required></p>
        <p><input name="email" type="email" placeholder="Email" required></p>
        <p><input name="password" type="password" placeholder="Пароль" required></p>
        <p><select name="role" required>
                <option value="">Выбери роль</option>
                <option value="driver">Водитель</option>
                <option value="passenger">Попутчик</option>
            </select></p>
        <button type="submit">Зарегистрироваться</button>
    </form><a href="{% url 'login' %}">Войти</a>
</body>

</html>
