<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Поездка</title>
</head>

<body>
    <h2>{% if trip %}Изменить поездку{% else %}Новая поездка{% endif %}</h2>
    {% if error %}<p style="color:red">{{ error }}</p>{% endif %}
    <form method="post" enctype="multipart/form-data">
        {% csrf_token %}
        <p>Откуда: <input name="start_location" required value="{{ trip.start_location|default:'' }}"></p>
        <p>Куда: <input name="end_location" required value="{{ trip.end_location|default:'' }}"></p>
        <p>Марка: <input name="car_brand" required value="{{ trip.car_brand|default:'' }}"></p>
        <p>Год: <input type="number" name="car_year" required value="{{ trip.car_year|default:'' }}"></p>
        <p>Фото: <input type="file" name="car_photo" accept="image/*" {% if not trip %}required{% endif %}></p>
        <p>Дата: <input type="datetime-local" name="date" required value="{{ trip.date|date:'Y-m-d\TH:i' }}"></p>
        <p>Места: <input type="number" name="seats_available" min="1" required
                value="{{ trip.seats_available|default:'' }}"></p>
        <p>Цена: <input type="number" name="price" step="0.01" min="0" required value="{{ trip.price|default:'' }}"></p>
        <p>Описание:<br><textarea name="description">{{ trip.description|default:'' 
}}</textarea></p>
        <button type="submit">Сохранить</button>
    </form>
    <p><a href="{% url 'my_trips' %}">Мои поездки</a></p>
</body>

</html>
