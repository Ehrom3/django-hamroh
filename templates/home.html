<!DOCTYPE html>
<html lang="ru">

<head>
    <meta charset="UTF-8">
    <title>Главная</title>
</head>

<body>
    <h2>Привет, {{ request.user.first_name }}!</h2>
    <p>Роль: {{ request.user.role }}</p>
    <form method="post" action="{% url 'logout' %}">{% csrf_token %}
        <button type="submit">Выйти</button>
    </form>
    {% if request.user.role == 'driver' %}
    <a href="{% url 'my_trips' %}">Мои поездки</a>
    {% endif %}
</body>

</html>
